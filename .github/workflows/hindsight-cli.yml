name: Update Hindsight CLI
on:
  schedule:
    - cron: '37 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hindsight-cli-pin
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      version: ${{ steps.cli.outputs.version }}
      changed: ${{ steps.cli.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: cli
        run: python3 .github/scripts/hindsight-cli.py verify
        env:
          GH_TOKEN: ${{ github.token }}
  update-pin:
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 .github/scripts/hindsight-cli.py publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_VERSION: ${{ needs.verify.outputs.version }}
          DEFAULT_BRANCH: ${{ github.ref_name }}
